name: canonical-title-repair

on:
  push:
    branches:
      - interface/canonical-title-binding-20260923

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interface/canonical-title-binding-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply bounded patch
        run: python3 scripts/canonical-title-preflight.py
      - name: Test patched tree
        run: npm test
      - name: Commit clean candidate
        shell: bash
        run: |
          rm .github/workflows/canonical-title-preflight.yml
          rm .github/workflows/canonical-title-repair.yml
          rm scripts/canonical-title-preflight.py
          git config user.name "mike-axiom-mir"
          git config user.email "miketobi90@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Add bounded canonical-state view titles"
          git push origin HEAD:interface/canonical-title-binding-20260923
