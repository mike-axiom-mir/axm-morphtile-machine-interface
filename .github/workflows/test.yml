name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  morphtile-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pins
        shell: bash
        run: |
          echo "morphtile=$(node -p 'require("./machine/machine.json").tested_against.commit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: ${{ steps.pins.outputs.morphtile }}
          path: morphtile
      - run: npm run test:integration
        working-directory: machine
        env:
          MORPHTILE_CORE: ../morphtile/core/morphtile.js
          MORPHTILE_COMMIT: ${{ steps.pins.outputs.morphtile }}

  assembly-receiver-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pins
        shell: bash
        run: |
          echo "morphtile=$(node -p 'require("./machine/machine.json").tested_against.commit')" >> "$GITHUB_OUTPUT"
          echo "assembly=$(node -p 'require("./machine/fixtures/integration-sources.json").assembly.commit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: ${{ steps.pins.outputs.assembly }}
          path: assembly
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: ${{ steps.pins.outputs.morphtile }}
          path: morphtile
      - run: npm run test:integration:assembly
        working-directory: machine
        env:
          MORPHTILE_ASSEMBLY: ../assembly/src
          MORPHTILE_ASSEMBLY_COMMIT: ${{ steps.pins.outputs.assembly }}
          MORPHTILE_CORE: ../morphtile/core/morphtile.js
          MORPHTILE_COMMIT: ${{ steps.pins.outputs.morphtile }}
