name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  morphtile-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 26b89a77f6a90715a6742dc4d084008ba63731b6
          path: morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:integration
        working-directory: machine
        env:
          MORPHTILE_CORE: ../morphtile/core/morphtile.js
          MORPHTILE_COMMIT: 26b89a77f6a90715a6742dc4d084008ba63731b6

  assembly-receiver-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 052e1618e499102e816ee537d16c0550e6942721
          path: assembly
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 26b89a77f6a90715a6742dc4d084008ba63731b6
          path: morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/assembly-dependency.integration.test.js
        working-directory: machine
        env:
          MORPHTILE_ASSEMBLY: ../assembly/src
          MORPHTILE_ASSEMBLY_COMMIT: 052e1618e499102e816ee537d16c0550e6942721
          MORPHTILE_CORE: ../morphtile/core/morphtile.js
          MORPHTILE_COMMIT: 26b89a77f6a90715a6742dc4d084008ba63731b6
